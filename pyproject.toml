[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "deadline-cloud-test-fixtures"
description = "This package contains pytest fixtures that are used to test AWS Deadline Cloud Python packages."
authors = [
  {name = "Amazon Web Services"},
]
dynamic = ["version"]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.9"
# https://pypi.org/classifiers/
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "License :: OSI Approved :: Apache Software License",
  "Intended Audience :: Developers",
]

# Note: All deps should be using >= since this is a *library*. Applications that
# consume this library should be the ones that are more strictly limiting dependencies
# if they want/need to.
dependencies = [
  "boto3 >= 1.34.75,<2.0",
  # boto3 depends on botocore, but we're finding that if we leave botocore to be resolved
  # transitively then resolving the dependency closure of this package in conjunction with
  # other test dependencies in other packages can result in it taking 20+ minutes to resolve
  # dependencies in Python3.9. So, we explicitly include the botocore dependency here.
  "botocore >= 1.34.75",
  "xa11y >= 0.9.1",
  "PyYAML >= 6.0",
  "numpy >= 1.23",
  "Pillow >= 10.0",
  "openjd-cli >= 0.7",
]

[project.urls]
Homepage = "https://github.com/aws-deadline/deadline-cloud-test-fixtures"
Source = "https://github.com/aws-deadline/deadline-cloud-test-fixtures"

[project.entry-points.pytest11]
deadline_test_fixtures = "deadline_test_fixtures.fixtures"

[tool.hatch.build]
artifacts = [
  "*_version.py",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "post-release"

[tool.hatch.build.hooks.vcs]
version-file = "_version.py"

[tool.hatch.build.hooks.custom]
path = "hatch_version_hook.py"

[[tool.hatch.build.hooks.custom.copy_map]]
sources = [
  "_version.py",
]
destinations = [
  "src/deadline_test_fixtures",
]

[tool.hatch.build.targets.sdist]
include = [
  "src/*",
  "hatch_version_hook.py",
]

[tool.hatch.build.targets.wheel]
packages = [
  "src/deadline_test_fixtures"
]

[tool.mypy]
check_untyped_defs = true
show_error_codes = true
pretty = true
files = [ "src/**/*.py" ]

[[tool.mypy.overrides]]
module = [
  "boto3",
  "botocore.*"
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "moto"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "deadline_test_fixtures._version"
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Rules below are ruff >= 0.16 defaults that this package deliberately does not
# follow. Each entry states why; prefer a targeted `noqa` over adding to this list.
ignore = [
  "E501",
  # Deliberate, across 9 sites: every blind `except Exception` here is a best-effort
  # boundary in a *test fixture*. EC2/accessibility diagnostics, the observability
  # callback in the mock backend, and stale-resource cleanup must never mask the real
  # test failure or break request handling. `except Exception: pytest.fail(...)` is
  # also the canonical pytest idiom. (S110, the `try`-`except`-`pass` half of this
  # pattern, is only 2 sites and carries a `noqa` at each instead.)
  "BLE001",
  # The `# fmt: off` / `# fmt: on` region around the Posix worker bootstrap command
  # list is load-bearing: this package formats with black, which honours those
  # regions (verified: removing them reformats the embedded `echo "TIMING: ..."`
  # literals). RUF028 only describes what `ruff format` can honour, so it does not
  # apply to this toolchain.
  "RUF028",
  # `" ; ".join([...])` / `" && ".join([...])` is how the worker bootstrap composes
  # shell commands, one statement per line. FLY002 collapses those into single
  # 250-400 character literals, which is materially harder to read and diff.
  "FLY002",
]

[tool.ruff.lint.per-file-ignores]
# hatchling loads this build hook as a standalone module that is never registered
# in sys.modules. PEP 563 string annotations would then make dataclasses fall back
# to `sys.modules.get(cls.__module__).__dict__` when scanning for ClassVar/KW_ONLY,
# which is None there and crashes the build on Python 3.14. Keep real annotation
# objects in this file, which means keeping typing.Optional.
"hatch_version_hook.py" = ["FA100"]

[tool.ruff.lint.flake8-bugbear]
# BundleNormalization is a frozen dataclass, so calling it in a default is safe.
extend-immutable-calls = [
  "deadline_test_fixtures.job_bundle.compare.BundleNormalization",
]

[tool.ruff.lint.isort]
known-first-party = [
  "deadline_test_fixtures"
]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312", "py313"]

[tool.pytest.ini_options]
xfail_strict = true
addopts = [
  "--durations=5",
  "--cov=src/deadline_test_fixtures",
  "--color=yes",
  "--cov-report=html:build/coverage",
  "--cov-report=xml:build/coverage/coverage.xml",
  "--cov-report=term-missing",
  "--numprocesses=auto",
]
testpaths = [ "test" ]
looponfailroots = [
  "src",
  "test",
]
# looponfailroots is deprecated, this removes the deprecation from the test output
filterwarnings = [
  "ignore::DeprecationWarning"
]

[tool.coverage.run]
source_pkgs = [ "deadline_test_fixtures" ]
omit = [
  "models.py",
  "fixtures.py",
  "deadline/stubs.py",
]


[tool.coverage.paths]
source = [
  "src/"
]

[tool.coverage.report]
show_missing = true

[tool.semantic_release]
# Can be removed or set to true once we are v1
major_on_zero = false
tag_format = "{version}"
allow_zero_version = true

[tool.semantic_release.commit_parser_options]
allowed_tags = [
    "build",
    "chore",
    "ci",
    "docs",
    "feat",
    "fix",
    "perf",
    "style",
    "refactor",
    "test",
]
minor_tags = []
patch_tags = [
  "chore",
  "feat",
  "fix",
  "refactor",
  "perf",
]

[tool.semantic_release.publish]
upload_to_vcs_release = false

[tool.semantic_release.changelog]
template_dir = ".semantic_release"

[tool.semantic_release.changelog.environment]
trim_blocks = true
lstrip_blocks = true

[tool.semantic_release.branches.release]
match = "(mainline|release|patch_.*)"
